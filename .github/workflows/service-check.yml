# templates/workflows/service-check.yml - checks that service.yaml agrees with map/map/services.yaml.
# copy to .github/workflows/service-check.yml. needs the map submodule, which is private: on aaanvil
# (every private repo) the runner hands each job a read-only token for it (env.AAANVIL_SUBMODULE_TOKEN),
# so no secret is needed; a `SUBMODULE_TOKEN` secret, when a repo has one, still wins.
name: service check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # private repo: our runners (aaanvil-linux); public: github's (ubuntu-latest). bylaaabs/infra docs/runners.md
    runs-on: ${{ github.event.repository.private && 'aaanvil-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || env.AAANVIL_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node map/scripts/check.mjs service.yaml
